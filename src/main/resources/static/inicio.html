<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería de Héroes – Overwatch</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo-link {
            display: block;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-link img {
            width: 280px;
            padding: 30px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 3px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.4);
            animation: respiracion 2.5s ease-in-out infinite;
        }

        @keyframes respiracion {
            0%   { transform: scale(1);    opacity: 1;    }
            50%  { transform: scale(1.08); opacity: 0.85; }
            100% { transform: scale(1);    opacity: 1;    }
        }

        .logo-link:hover img {
            transform: scale(1.1);
            opacity: 1;
        }

        .contenedor-inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

    </style>
</head>
<body>

<body>

<div class="contenedor-inicio">

    <a href="index.html" class="logo-link">
        <img src="Imagenes/Logo/ow_logo.png" alt="Overwatch">
    </a>

    <h2 class="texto-inicio">Click to enter the gallery</h2>

</div>

</body>
</body>
</html>
